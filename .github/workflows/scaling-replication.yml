name: Experiment 8 independent replication

on:
  push:
    branches: ["experiment/cognitive-scaling-e8-corrected"]
  workflow_dispatch:

jobs:
  thirty-seed-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Verify contextual cognitive behavior
        run: python -m pytest -q tests/test_scaling.py
      - name: Thirty independent seeds across three frozen checkpoints
        run: |
          SEEDS="$(seq -s, 1 30)"
          scenario-chunking --scaling --output results-scaling-replication \
            --seeds "$SEEDS" --rounds 4 \
            --training-stages 20,100,500 --memory-stages 100 \
            --complexities 2 \
            --scaling-conditions untrained_structural,strong_one_pass,learned_focus_one_pass,adaptive_focus \
            --scaling-action-budget 3 --candidate-budget 32
      - name: Verify paired seed-level uncertainty and negative outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("results-scaling-replication/scaling_summary.json").read_text())
          r = json.loads(Path("results-scaling-replication/scaling_trials.json").read_text())
          assert p["experiment"] == 8 and len(p["seeds"]) == 30
          assert len(r) == 30 * 3 * 4
          assert all(len(p["paired_reflection_only"][s]["by_seed"]) == 30 for s in ("20", "100", "500"))
          assert all(len(p["paired_reflection_only"][s]["bootstrap_95_interval"]) == 2 for s in ("20", "100", "500"))
          print("Paired reflection:", json.dumps(p["paired_reflection_only"], sort_keys=True))
          print("Paired focus:", json.dumps(p["paired_focus_vs_onepass"], sort_keys=True))
          PY
      - name: Compilation and scoped diff integrity
        run: |
          python -m compileall -q src tests
          git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment8-30seed-replication
          path: results-scaling-replication/
          if-no-files-found: ignore
