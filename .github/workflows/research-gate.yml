name: Scenario Chunking research gate

on:
  push:
    branches: ["experiment/bounded-causal-spreading", "experiment/independent-meaning", "experiment/category-transfer-e6", "experiment/adaptive-uncertainty-e7", "experiment/cognitive-scaling-e8", "experiment/cognitive-scaling-e8-corrected", "experiment/temporal-prediction-e9", "experiment/predictive-decision-value-e10", "experiment/incremental-refinement-e11", "experiment/incremental-refinement-e11-continuity", "main"]
  pull_request:
    branches: ["main", "experiment/cognitive-scaling-e8-corrected", "experiment/predictive-decision-value-e10"]
  workflow_dispatch:

concurrency:
  group: scenario-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-refinement-e11:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: E11 focused live-path, negative-control and subprocess restart tests
        run: python -m pytest -q tests/test_incremental.py
      - name: E11 independent-seed prequential replication, matched controls and ablation
        run: |
          python - <<'PY'
          from scenario_chunking.incremental_experiment import write_incremental_benchmark
          p = write_incremental_benchmark(seeds=(7, 23, 61, 101, 149))
          assert len(p["trials"]) == 5 * 3 * 32 * 5
          assert len(p["frozen_trials"]) == 5 * 3 * 8 * 5
          assert p["frozen_training_protocol"]["same_interventions_across_treatments"]
          assert p["frozen_training_protocol"]["each_heldout_case_from_identical_pretest_snapshot"]
          for condition, stages in p["frozen_summary"].items():
              print("E11_FROZEN_CONDITION", condition, stages)
          for row in p["frozen_paired_seed_deltas"]:
              print("E11_FROZEN_PAIRED_SEED", row)
          for condition, stages in p["summary"].items():
              print("E11_CONDITION", condition, stages)
          for row in p["paired_seed_deltas"]:
              print("E11_PAIRED_SEED", row)
          PY
      - name: E11 compile and clean diff
        run: |
          python -m compileall -q src tests
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e11-prequential-artifacts
          path: results-e11
          if-no-files-found: ignore

  predictive-temporal-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: predictive-temporal-focused-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Experiment 10 thirty independent seed replication
        run: |
          python - <<'PY'
          from scenario_chunking.decision_value_experiment import write_decision_value_benchmark
          p = write_decision_value_benchmark(
              output="results-e10", seeds=tuple(range(30)),
              training_stages=(0, 20, 100), cases=tuple(range(6)))
          assert len(p["trials"]) == 30 * 3 * 6 * 8
          for stage, values in p["paired_comparisons"].items():
              print("E10_PAIRED_STAGE", stage, values)
              print("E10_FULL", stage, p["summary"][stage]["predictive_value"])
              print("E10_COMPUTE_MATCHED", stage,
                    p["summary"][stage]["compute_matched_one_pass"])
          PY
      - name: E10 five-seed distracting-memory challenge
        run: |
          python - <<'PY'
          from scenario_chunking.decision_value_experiment import write_decision_value_benchmark
          p = write_decision_value_benchmark(
              output="results-e10-distractors", seeds=(3, 7, 23, 61, 101),
              training_stages=(20, 100), cases=tuple(range(6)),
              distractors=500)
          assert len(p["trials"]) == 5 * 2 * 6 * 8
          for stage, values in p["paired_comparisons"].items():
              print("E10_DISTRACTOR_PAIRED_STAGE", stage, values)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e10-replication-artifacts
          path: |
            results-e10
            results-e10-distractors
          if-no-files-found: ignore

  predictive-temporal-focused-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: E10 focused temporal decision tests
        run: python -m pytest -q tests/test_decision_value.py tests/test_temporal.py
      - name: E10 paired replication smoke and compilation
        run: |
          python - <<'PY'
          from scenario_chunking.decision_value_experiment import run_decision_value_benchmark
          p = run_decision_value_benchmark(seeds=(7, 23),
                                           training_stages=(0, 20),
                                           cases=(0, 1))
          assert len(p["trials"]) == 64
          print("E10_PAIRS", p["summary"])
          PY
          python -m compileall -q src tests
  temporal-focused-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Experiment 9 focused behavioral tests
        run: python -m pytest -q tests/test_temporal.py
      - name: Experiment 9 paired research smoke
        run: |
          python - <<'PY'
          from scenario_chunking.temporal_experiment import write_temporal_benchmark
          result = write_temporal_benchmark()
          assert len(result["trials"]) == 100
          assert not any(row["false_failure_claim"] for row in result["trials"])
          print(result["summary"])
          PY
      - name: Compile temporal owners and tests
        run: python -m compileall -q src tests
  research-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Focused behavioral tests
        run: python -m pytest -q tests/test_spreading.py tests/test_meaning.py tests/test_refinement.py tests/test_progressive_hypotheses.py
      - name: Experiment 6 focused transfer tests
        run: python -m pytest -q tests/test_transfer.py
      - name: Full suite
        run: python -m pytest -q
      - name: Compilation
        run: python -m compileall -q src tests
      - name: Diff integrity and working-tree hygiene
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE="HEAD^"; fi
          git diff --check "$BASE" HEAD
          git status --short
          test -z "$(git status --porcelain)"
      - name: Run independent benchmark (5 seeds; 1000 distractors)
        run: scenario-chunking --output results --meaning
      - name: Verify measurement payload
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results/results.json"))
          for key in ("structural", "structural_topk8", "spreading"):
              assert key in d["aggregate"], f"missing {key}"
          assert len(d["seeds"]) == 5
          assert d["meaning_experiment"]["enabled"]
          for key in ("meaning_fixed", "meaning_learned", "meaning_gate_only", "meaning_adaptive"):
              assert key in d["aggregate"], f"missing meaning treatment: {key}"
          assert all("meaning" in entry for r in d["runs"]
                     if r["mode"].startswith("meaning_")
                     for ep in r["episodes"] for entry in ep["trace"])
          assert d["neighbor_budget"]["max_hops"] == 1
          assert all("initially_activated" in entry for r in d["runs"]
                     for ep in r["episodes"] for entry in ep["trace"])
          reference_misses = [
              {"seed": r["seed"], **item}
              for r in d["runs"] if r["mode"] == "structural"
              for item in r.get("same_snapshot_recovery_audit", [])
              if item["baseline_missed"]
          ]
          print("SAME_SNAPSHOT_MISSES=" + json.dumps(reference_misses, sort_keys=True))
          for key in ("structural", "meaning_fixed", "meaning_learned",
                      "meaning_gate_only", "meaning_adaptive"):
              summary = d["aggregate"][key]
              print("MEANING_METRICS " + key + " " + json.dumps({
                  field: summary.get(field) for field in
                  ("completion_rate_mean", "actions_mean", "failed_actions_mean",
                   "repeated_actions_mean", "retrieval_recall_at_k_mean",
                   "active_detail_events_mean", "retrieval_latency_ms_mean",
                   "peak_memory_bytes_mean", "try_key_brier_mean",
                   "selection_latency_ms_mean", "interpretation_event_evaluations_mean",
                   "total_decision_event_evaluations_mean",
                   "paired_direct_action_changes_mean", "stored_meanings_mean")
              }, sort_keys=True))
              relevant = [r for r in d["runs"] if r["mode"] == key]
              if relevant:
                  print("MEANING_LEARNING " + key + " " + json.dumps({
                      "seeds_with_axis_updates": sum(bool(r.get("meaning_snapshot", {}).get("layer_associations"))
                                                   for r in relevant),
                      "seeds_with_gate_updates": sum(bool(r.get("meaning_snapshot", {}).get("integration_logits"))
                                                   for r in relevant),
                      "axes_with_stored_meanings": sorted({
                          axis for r in relevant for ep in r["episodes"] for step in ep["trace"]
                          if step.get("meaning") for axis in step["meaning"]["layers"]
                      }),
                      "axes_with_learned_gain": sorted({
                          key.split("|")[0] for r in relevant for key, value in
                          r.get("meaning_snapshot", {}).get("layer_associations", {}).items()
                          if abs(value) > 1e-8
                      }),
                      "axes_with_adapted_gate": sorted({
                          key.split("|")[1] for r in relevant for key, value in
                          r.get("meaning_snapshot", {}).get("integration_logits", {}).items()
                          if abs(value) > 1e-8
                      }),
                      "heldout_E6_actions": [next(e["actions"] for e in r["episodes"]
                                                 if e["episode_id"] == "E6_relational_transfer")
                                             for r in relevant],
                  }, sort_keys=True))
          PY
      - name: Run bounded refinement research smoke benchmark
        run: scenario-chunking --output results-refinement --modes structural --seeds 7 --distractors 35 --refinement
      - name: Verify refinement payload
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results-refinement/results.json"))
          assert d["refinement_experiment"]["enabled"]
          for mode in ("refinement_refine", "refinement_associate", "refinement_learned"):
              assert mode in d["aggregate"]
              runs = [r for r in d["runs"] if r["mode"] == mode]
              assert len(runs) == 1 and len(runs[0]["episodes"]) == 6
              assert all(step["thought"] for ep in runs[0]["episodes"] for step in ep["trace"])
              assert all(step["interpretation_event_evaluations"] <= step["total_detailed_events_this_retrieval"]
                         for ep in runs[0]["episodes"] for step in ep["trace"])
          print("REFINEMENT_METRICS=" + json.dumps({
              mode: {k: d["aggregate"][mode].get(k)
                     for k in ("completion_rate_mean", "actions_mean",
                               "try_key_brier_mean", "total_decision_event_evaluations_mean",
                               "reinstatement_details_mean", "thought_versions_mean",
                               "paired_refinement_action_changes_mean")}
              for mode in ("structural", "refinement_refine", "refinement_associate", "refinement_learned")
          }, sort_keys=True))
          PY
      - name: Verify independent held-out reasoning cases
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results-refinement/heldout_refinement.json"))
          assert len(d["seeds"]) == 1
          assert set(d["conditions"]) == {
              "uncertain_misleading_report", "replaced_lock",
              "irrelevant_history", "clear_current_report", "delayed_feedback",
          }
          for case, modes in d["summary"].items():
              assert set(modes) == {
                  "structural", "structural_topk8", "refinement_refine",
                  "refinement_associate", "refinement_learned",
              }
              assert all(0 <= v["completion_rate"] <= 1 for v in modes.values())
              print("HELDOUT_CASE " + case + " " + json.dumps(modes, sort_keys=True))
          PY
      - name: Run five-seed held-out cognition challenge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scenario_chunking.experiment import run_heldout_refinement_benchmark
          results = run_heldout_refinement_benchmark()
          assert len(results["seeds"]) == 5 and len(results["trials"]) == 125
          Path("results-refinement/heldout_refinement_5seed.json").write_text(
              json.dumps(results, indent=2, sort_keys=True), encoding="utf-8")
          for condition, values in results["summary"].items():
              print("HELDOUT_5SEED " + condition + " " + json.dumps(values, sort_keys=True))
          PY
      - name: Experiment 6 five-seed transfer and ablation gate
        run: scenario-chunking --transfer --output results-transfer --seeds 7,23,61,101,149 --rounds 4
      - name: Verify Experiment 6 evidence and controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("results-transfer/transfer_summary.json").read_text())
          assert p["experiment"] == 6
          assert len(p["seeds"]) == 5
          assert len(p["conditions"]) == 7
          assert len(p["ablations"]) == 5
          assert all(x["restarts_preserved"] for x in p["conditions"].values())
          assert p["conditions"]["extended_reflection"]["reflection_action_changes"] > 0, "refiner did not alter live decisions"
          assert p["conditions"]["extended_reflection"]["recovered_goal_rate"] >= p["conditions"]["untrained_structural"]["recovered_goal_rate"]
          assert all("round_recovery" in m for m in p["conditions"].values())
          for name, metrics in p["conditions"].items():
              assert 0 <= metrics["completion_rate"] <= 1
              assert len(metrics["round_completion"]) == 4
              print("TRANSFER " + name + " " + json.dumps(metrics, sort_keys=True))
          print("ABLATIONS=" + json.dumps(p["ablations"], sort_keys=True))
          print("VERDICT=" + json.dumps(p["verdict"], sort_keys=True))
          PY
      - name: Experiment 7 focused cognitive tests
        run: python -m pytest -q tests/test_uncertainty.py
      - name: Experiment 7 five-seed uncertainty challenge
        run: scenario-chunking --uncertainty --output results-uncertainty --seeds 7,23,61,101,149 --rounds 4 --distractors 4 --action-budget 9
      - name: Verify Experiment 7 matched comparisons without assuming success
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("results-uncertainty/uncertainty_summary.json").read_text())
          assert p["experiment"] == 7
          assert len(p["seeds"]) == 5
          assert len(p["conditions"]) == 9
          assert len(p["ablations"]) == 5
          assert all(x["restarts_preserved"] for x in p["conditions"].values())
          for name, metrics in p["conditions"].items():
              assert 0 <= metrics["completion_rate"] <= 1
              assert len(metrics["round_completion"]) == 4
              assert len(metrics["by_seed"]) == 5
              print("UNCERTAINTY " + name + " " + json.dumps(metrics, sort_keys=True))
          print("UNCERTAINTY_ABLATIONS=" + json.dumps(p["ablations"], sort_keys=True))
          print("UNCERTAINTY_VERDICT=" + json.dumps(p["verdict"], sort_keys=True))
          PY
      - name: Experiment 8 focused scaling and durability tests
        run: python -m pytest -q tests/test_scaling.py
      - name: Experiment 8 small end-to-end research gate
        run: |
          scenario-chunking --scaling --output results-scaling \
            --seeds 7 --rounds 2 --scaling-action-budget 3 \
            --training-stages 20,100 --memory-stages 50,100 --complexities 1,3 \
            --scaling-conditions untrained_structural,strong_one_pass,adaptive_focus,bounded_without_learned_focus \
            --candidate-budget 32
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("results-scaling/scaling_summary.json").read_text())
          trials = json.loads(Path("results-scaling/scaling_trials.json").read_text())
          assert p["experiment"] == 8
          assert len(trials) == 32
          assert set(p["stage_results"]) == {"20", "100"}
          assert all(0 <= r["completion_rate"] <= 1 for r in trials)
          assert all(r["mean_header_evaluations"] <= 32 for r in trials if r["treatment"] != "larger_retrieval")
          print("Experiment 8 smoke:", json.dumps(p["paired_focus_vs_onepass"], sort_keys=True))
          PY
      - name: Experiment 9 focused temporal cognition tests
        run: python -m pytest -q tests/test_temporal.py
      - name: Experiment 9 paired temporal research gate
        run: |
          python - <<'PY'
          from scenario_chunking.temporal_experiment import write_temporal_benchmark
          report = write_temporal_benchmark()
          assert report["experiment"] == 9
          assert len(report["trials"]) == 100
          assert report["summary"]["temporal"]["due_wakes"] == 25
          assert report["summary"]["memory_only"]["due_wakes"] == 0
          assert not any(row["false_failure_claim"] for row in report["trials"])
          for mode, metrics in report["summary"].items():
              print("E9", mode, metrics)
          PY
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-meaning-research
          path: |
            results/
            results-refinement/
            results-transfer/
            results-uncertainty/
            results-scaling/
            results-temporal/
          if-no-files-found: ignore
