name: Scenario Chunking research gate

on:
  push:
    branches: ["experiment/bounded-causal-spreading", "experiment/independent-meaning", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  research-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - name: Focused behavioral tests
        run: python -m pytest -q tests/test_spreading.py tests/test_meaning.py tests/test_refinement.py tests/test_progressive_hypotheses.py
      - name: Full suite
        run: python -m pytest -q
      - name: Compilation
        run: python -m compileall -q src tests
      - name: Diff integrity and working-tree hygiene
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then BASE="HEAD^"; fi
          git diff --check "$BASE" HEAD
          git status --short
          test -z "$(git status --porcelain)"
      - name: Run independent benchmark (5 seeds; 1000 distractors)
        run: scenario-chunking --output results --meaning
      - name: Verify measurement payload
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results/results.json"))
          for key in ("structural", "structural_topk8", "spreading"):
              assert key in d["aggregate"], f"missing {key}"
          assert len(d["seeds"]) == 5
          assert d["meaning_experiment"]["enabled"]
          for key in ("meaning_fixed", "meaning_learned", "meaning_gate_only", "meaning_adaptive"):
              assert key in d["aggregate"], f"missing meaning treatment: {key}"
          assert all("meaning" in entry for r in d["runs"]
                     if r["mode"].startswith("meaning_")
                     for ep in r["episodes"] for entry in ep["trace"])
          assert d["neighbor_budget"]["max_hops"] == 1
          assert all("initially_activated" in entry for r in d["runs"]
                     for ep in r["episodes"] for entry in ep["trace"])
          reference_misses = [
              {"seed": r["seed"], **item}
              for r in d["runs"] if r["mode"] == "structural"
              for item in r.get("same_snapshot_recovery_audit", [])
              if item["baseline_missed"]
          ]
          print("SAME_SNAPSHOT_MISSES=" + json.dumps(reference_misses, sort_keys=True))
          for key in ("structural", "meaning_fixed", "meaning_learned",
                      "meaning_gate_only", "meaning_adaptive"):
              summary = d["aggregate"][key]
              print("MEANING_METRICS " + key + " " + json.dumps({
                  field: summary.get(field) for field in
                  ("completion_rate_mean", "actions_mean", "failed_actions_mean",
                   "repeated_actions_mean", "retrieval_recall_at_k_mean",
                   "active_detail_events_mean", "retrieval_latency_ms_mean",
                   "peak_memory_bytes_mean", "try_key_brier_mean",
                   "selection_latency_ms_mean", "interpretation_event_evaluations_mean",
                   "total_decision_event_evaluations_mean",
                   "paired_direct_action_changes_mean", "stored_meanings_mean")
              }, sort_keys=True))
              relevant = [r for r in d["runs"] if r["mode"] == key]
              if relevant:
                  print("MEANING_LEARNING " + key + " " + json.dumps({
                      "seeds_with_axis_updates": sum(bool(r.get("meaning_snapshot", {}).get("layer_associations"))
                                                   for r in relevant),
                      "seeds_with_gate_updates": sum(bool(r.get("meaning_snapshot", {}).get("integration_logits"))
                                                   for r in relevant),
                      "axes_with_stored_meanings": sorted({
                          axis for r in relevant for ep in r["episodes"] for step in ep["trace"]
                          if step.get("meaning") for axis in step["meaning"]["layers"]
                      }),
                      "axes_with_learned_gain": sorted({
                          key.split("|")[0] for r in relevant for key, value in
                          r.get("meaning_snapshot", {}).get("layer_associations", {}).items()
                          if abs(value) > 1e-8
                      }),
                      "axes_with_adapted_gate": sorted({
                          key.split("|")[1] for r in relevant for key, value in
                          r.get("meaning_snapshot", {}).get("integration_logits", {}).items()
                          if abs(value) > 1e-8
                      }),
                      "heldout_E6_actions": [next(e["actions"] for e in r["episodes"]
                                                 if e["episode_id"] == "E6_relational_transfer")
                                             for r in relevant],
                  }, sort_keys=True))
          PY
      - name: Run bounded refinement research smoke benchmark
        run: scenario-chunking --output results-refinement --modes structural --seeds 7 --distractors 35 --refinement
      - name: Verify refinement payload
        run: |
          python - <<'PY'
          import json
          d = json.load(open("results-refinement/results.json"))
          assert d["refinement_experiment"]["enabled"]
          for mode in ("refinement_refine", "refinement_associate", "refinement_learned"):
              assert mode in d["aggregate"]
              runs = [r for r in d["runs"] if r["mode"] == mode]
              assert len(runs) == 1 and len(runs[0]["episodes"]) == 6
              assert all(step["thought"] for ep in runs[0]["episodes"] for step in ep["trace"])
              assert all(step["interpretation_event_evaluations"] <= step["total_detailed_events_this_retrieval"]
                         for ep in runs[0]["episodes"] for step in ep["trace"])
          print("REFINEMENT_METRICS=" + json.dumps({
              mode: {k: d["aggregate"][mode].get(k)
                     for k in ("completion_rate_mean", "actions_mean",
                               "try_key_brier_mean", "total_decision_event_evaluations_mean",
                               "reinstatement_details_mean", "thought_versions_mean",
                               "paired_refinement_action_changes_mean")}
              for mode in ("structural", "refinement_refine", "refinement_associate", "refinement_learned")
          }, sort_keys=True))
          PY
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-meaning-research
          path: |
            results/
            results-refinement/
          if-no-files-found: ignore
